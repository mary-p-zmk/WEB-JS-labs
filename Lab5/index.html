<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Lab5 - Pixel Hunt</title>
    <style>
        /* Основні стилі сторінки */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { 
            margin-top: 30px; 
            color: #2c3e50; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Панель налаштувань */
        .controls { 
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        label { font-weight: 600; color: #555; }

        select, button {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52,152,219,0.3); }

        #start-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 10px 25px;
            text-transform: uppercase;
        }

        #start-btn:hover { background-color: #2ecc71; transform: translateY(-2px); }

        /* Статистика гри */
        #game-info {
            display: flex;
            gap: 30px;
            background: #2c3e50;
            color: white;
            padding: 12px 40px;
            border-radius: 50px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .stats { font-size: 1.2em; font-weight: bold; }
        #timer { color: #ff7675; }
        #score { color: #55efc4; }

        /* Ігрове поле */
        #game-field { 
            position: relative; 
            width: 90%; 
            max-width: 900px;
            height: 500px; 
            background: white; 
            border-radius: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05), 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: none; 
            border: 2px solid #eee;
        }

        /* Ціль (піксель) */
        #pixel {
            position: absolute;
            cursor: pointer;
            display: none;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.5);
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Анімація появи */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>Lab 5: Pixel Hunter</h1>
    
    <div id="setup" class="controls">
        <label>Difficulty:</label>
        <select id="difficulty">
            <option value="">-- Choose --</option>
            <option value="lazy">Lazy (4s)</option>
            <option value="normal">Normal (2s)</option>
            <option value="catchme">Hardcore (1s)</option>
        </select>

        <label>Color:</label>
        <select id="color">
            <option value="">-- Choose --</option>
            <option value="#e74c3c">Red</option>
            <option value="#2ecc71">Green</option>
            <option value="#3498db">Blue</option>
            <option value="#f1c40f">Yellow</option>
        </select>

        <button id="start-btn">Start Game</button>
    </div>

    <div id="game-info" style="display:none;">
        <div class="stats">Score: <span id="score">0</span></div>
        <div class="stats">Time: <span id="timer">0</span>s</div>
    </div>

    <div id="game-field">
        <div id="pixel"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
