<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №8 | JavaScript UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">WEB<span>LAB8</span></div>
        <button class="hamburger" id="hamburger-btn">☰</button>
        <ul class="nav-links" id="nav-menu">
            <li><a href="#"><span class="icon">🏠</span><span class="text">Головна</span></a></li>
            <li><a href="#"><span class="icon">🔍</span><span class="text">Пошук</span></a></li>
            <li><a href="#"><span class="icon">⭐</span><span class="text">Вибране</span></a></li>
            <li><a href="#"><span class="icon">⚙️</span><span class="text">Налаштування</span></a></li>
            <li><a href="#"><span class="icon">👤</span><span class="text">Профіль</span></a></li>
        </ul>
    </header>

    <main>
        <section class="carousel">
            <div class="carousel-viewport">
                <div class="carousel-track" id="track">
                    <div class="slide">
                        <img src="https://picsum.photos/id/20/1200/600" alt="Slide 1">
                    </div>
                    <div class="slide">
                        <img src="https://picsum.photos/id/26/1200/600" alt="Slide 2">
                    </div>
                    <div class="slide">
                        <img src="https://picsum.photos/id/37/1200/600" alt="Slide 3">
                    </div>
                </div>
            </div>
    
            <button class="arrow prev" id="btn-prev">❮</button>
            <button class="arrow next" id="btn-next">❯</button>

            <div class="indicators" id="dots"></div>
        </section>

        <section class="content-container">
            
            <div class="large-only">
                <h2 class="section-title">Контент для Large-пристроїв</h2>
                <div class="image-grid">
                    <img src="https://picsum.photos/id/10/400/300" alt="Large 1">
                    <img src="https://picsum.photos/id/20/400/300" alt="Large 2">
                    <img src="https://picsum.photos/id/30/400/300" alt="Large 3">
                </div>
            </div>

            <div class="medium-only">
                <h2 class="section-title">Мобільний перегляд (Medium)</h2>
                <div class="image-stack">
                    <img src="https://picsum.photos/id/40/600/400" alt="Medium 1">
                    <img src="https://picsum.photos/id/50/600/400" alt="Medium 2">
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
