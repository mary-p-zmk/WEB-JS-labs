<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №8-js</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">WebDev Lab8</div>
        <button class="hamburger" id="hamburger" aria-label="Меню">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="nav-links" id="nav-links">
            <li><a href="#">Головна</a></li>
            <li><a href="#">Проєкти</a></li>
            <li><a href="#">Послуги</a></li>
            <li><a href="#">Блог</a></li>
            <li><a href="#">Контакти</a></li>
        </ul>
    </nav>

    <main>
        <section class="carousel-section">
            <div class="carousel-container">
                <div class="carousel-slide" id="carousel-slide">
                    <img src="images/slide1.jpg" alt="Slide 1">
                    <img src="images/slide2.jpg" alt="Slide 2">
                    <img src="images/slide3.jpg" alt="Slide 3">
                    <img src="images/slide4.jpg" alt="Slide 4">
                </div>
                
                <button class="carousel-btn prev" id="prevBtn">❮</button>
                <button class="carousel-btn next" id="nextBtn">❯</button>

                <div class="carousel-indicators" id="indicators">
                    </div>
            </div>
        </section>

        <section class="content-section">
            <div class="large-devices-only">
                <h2>Контент для Large пристроїв (>=768px)</h2>
                <div class="img-grid">
                    <img src="images/large1.jpg" alt="Large device view 1">
                    <img src="images/large2.jpg" alt="Large device view 2">
                </div>
            </div>

            <div class="medium-devices-only">
                <h2>Контент для Medium пристроїв (<768px)</h2>
                <div class="img-grid">
                    <img src="images/medium1.jpg" alt="Medium device view 1">
                    <img src="images/medium2.jpg" alt="Medium device view 2">
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
