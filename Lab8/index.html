<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №8</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">LAB.<span>JS</span></div>
        
        <!-- Кнопка Гамбургер (Medium) -->
        <button class="hamburger" id="hamburger-btn">☰</button>

        <!-- Меню з піктограмами (Large) -->
        <ul class="nav-links" id="nav-menu">
            <li><a href="#"><span class="icon">🏠</span><span class="text">Головна</span></a></li>
            <li><a href="#"><span class="icon">🖼️</span><span class="text">Галерея</span></a></li>
            <li><a href="#"><span class="icon">🛠️</span><span class="text">Послуги</span></a></li>
            <li><a href="#"><span class="icon">✉️</span><span class="text">Контакти</span></a></li>
        </ul>
    </header>

    <main>
        <!-- Карусель -->
        <section class="carousel">
            <div class="carousel-viewport">
                <div class="carousel-track" id="track">
                    <div class="slide"><img src="images/slide1.jpg" alt="1"></div>
                    <div class="slide"><img src="images/slide2.jpg" alt="2"></div>
                    <div class="slide"><img src="images/slide3.jpg" alt="3"></div>
                    <div class="slide"><img src="images/slide4.jpg" alt="4"></div>
                </div>
            </div>
            
            <button class="arrow prev" id="btn-prev">❮</button>
            <button class="arrow next" id="btn-next">❯</button>

            <div class="indicators" id="dots"></div>
        </section>

        <!-- Адаптивні зображення -->
        <section class="images-box">
            <!-- Тільки для Large (>=768px) -->
            <div class="large-content">
                <h2>Контент для Large-пристроїв</h2>
                <div class="grid">
                    <img src="images/desktop1.jpg" alt="Desktop">
                    <img src="images/desktop2.jpg" alt="Desktop">
                    <img src="images/desktop3.jpg" alt="Desktop">
                </div>
            </div>

            <!-- Тільки для Medium (<768px) -->
            <div class="medium-content">
                <h2>Контент для Medium-пристроїв</h2>
                <div class="stack">
                    <img src="images/mobile1.jpg" alt="Mobile">
                    <img src="images/mobile2.jpg" alt="Mobile">
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
